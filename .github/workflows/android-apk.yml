name: Build Rockbox RCC Android APK

on:
  push:
    branches:
      - android13-fix-work
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java for Android SDK manager
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install legacy Android platform and build tools
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install "platform-tools" "platforms;android-19" "build-tools;19.1.0"

      - name: Install Java 8 for the legacy Android build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison flex perl zip unzip wget lib32stdc++6

      - name: Install legacy NDK with ARMv5 GCC toolchain
        run: |
          curl -fL --retry 3 -o /tmp/android-ndk-r10e-linux-x86_64.bin https://dl.google.com/android/ndk/android-ndk-r10e-linux-x86_64.bin
          chmod +x /tmp/android-ndk-r10e-linux-x86_64.bin
          /tmp/android-ndk-r10e-linux-x86_64.bin -y
          NDK="$GITHUB_WORKSPACE/android-ndk-r10e"
          TOOLCHAIN="$NDK/toolchains/arm-linux-androideabi-4.9/prebuilt/linux-x86_64/bin"
          test -x "$TOOLCHAIN/arm-linux-androideabi-gcc"
          "$TOOLCHAIN/arm-linux-androideabi-gcc" --version
          # Verify GCC can select the bundled BFD linker and emit the same map files used by codec links.
          printf "int main(void) { return 0; }\n" | "$TOOLCHAIN/arm-linux-androideabi-gcc" --sysroot="$NDK/platforms/android-16/arch-arm" -fuse-ld=bfd -x c - -Wl,-Map,/tmp/android-bfd-test.map -o /tmp/android-bfd-test
          test -s /tmp/android-bfd-test.map
          echo "BFD linker selection and map-file smoke test passed."
          echo "ANDROID_NDK_PATH=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_PATH=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Configure Rockbox Android target
        run: |
          mkdir -p build-android
          cd build-android
          ../tools/configure --target=android --lcdwidth=1080 --lcdheight=2340 --eq-bands=30

      - name: Build native core and codecs
        run: make -C build-android -j2

      - name: Package Rockbox resources and APK
        run: |
          make -C build-android zip
          make -C build-android apk

      - name: Verify APK package, ABI, signature, alignment and native relocations
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find build-android -maxdepth 1 -type f -name 'rockbox-rcc-*.apk' -print -quit)"
          test -n "$APK"
          echo "APK=$APK" >> "$GITHUB_ENV"
          "$ANDROID_HOME/build-tools/19.1.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='org.rockbox'" /tmp/badging.txt
          unzip -Z1 "$APK" | grep -q '^lib/armeabi/librockbox.so$'
          mkdir -p /tmp/apk-check
          unzip -q "$APK" 'lib/armeabi/*.so' -d /tmp/apk-check
          test -f /tmp/apk-check/lib/armeabi/librockbox.so
          TEXTREL_FOUND=0
          for so in /tmp/apk-check/lib/armeabi/*.so; do
            if ! readelf -h "$so" >/dev/null 2>&1; then
              echo "Skipping non-ELF payload: $so"
              continue
            fi
            if readelf -d "$so" 2>/dev/null | grep -E 'TEXTREL|FLAGS.*TEXTREL'; then
              echo "ERROR: text relocations remain in $so"
              TEXTREL_FOUND=1
            fi
          done
          if [ "$TEXTREL_FOUND" -ne 0 ]; then
            echo "One or more Android native libraries still contain text relocations."
            echo "===== librockbox.so dynamic section ====="
            readelf -dW /tmp/apk-check/lib/armeabi/librockbox.so || true
            echo "===== librockbox.so dynamic relocations ====="
            readelf -rW /tmp/apk-check/lib/armeabi/librockbox.so || true
            echo "===== librockbox.so section headers ====="
            readelf -SW /tmp/apk-check/lib/armeabi/librockbox.so || true
            TOOLCHAIN="$ANDROID_NDK_PATH/toolchains/arm-linux-androideabi-4.9/prebuilt/linux-x86_64/bin"
            test -x "$TOOLCHAIN/arm-linux-androideabi-addr2line"
            test -x "$TOOLCHAIN/arm-linux-androideabi-objdump"
            echo "===== librockbox.so relocation source addresses ====="
            "$TOOLCHAIN/arm-linux-androideabi-addr2line" -f -C -e /tmp/apk-check/lib/armeabi/librockbox.so 0x8ad84 0x8ad88 0x8ad8c 0x94468 0x9449c 0x944d0 || true
            echo "===== librockbox.so disassembly around text relocation targets ====="
            "$TOOLCHAIN/arm-linux-androideabi-objdump" -d -j .text --start-address=0x8ad60 --stop-address=0x8ada0 /tmp/apk-check/lib/armeabi/librockbox.so || true
            "$TOOLCHAIN/arm-linux-androideabi-objdump" -d -j .text --start-address=0x94448 --stop-address=0x944e0 /tmp/apk-check/lib/armeabi/librockbox.so || true
            echo "===== linker map input sections covering text relocation targets ====="
            MAP="build-android/rockbox.map"
            if [ -s "$MAP" ]; then
              python3 -c 'exec("import sys\\ntargets=[0x8ad84,0x8ad88,0x8ad8c,0x94468,0x9449c,0x944d0]\\nrows=[]\\nfor no,line in enumerate(open(sys.argv[1],errors=\\x27replace\\x27),1):\\n parts=line.split(None,3)\\n if len(parts)>=4 and parts[0].startswith(\\x27.\\x27) and parts[1].startswith(\\x270x\\x27) and parts[2].startswith(\\x270x\\x27):\\n  rows.append((no,int(parts[1],16),int(parts[2],16),line.rstrip()))\\nfor target in targets:\\n matches=[r for r in rows if r[1] <= target < r[1]+r[2]]\\n print(\\x27target 0x%x:\\x27 % target)\\n for row in matches: print(\\x27  map line %d: %s\\x27 % (row[0],row[3]))\\n if not matches: print(\\x27  no input-section range matched\\x27)")' "$MAP"
            else
              echo "ERROR: expected $MAP was not generated"
            fi
            exit 1
          fi
          "$ANDROID_HOME/build-tools/19.1.0/zipalign" -c 4 "$APK"
          jarsigner -verify "$APK"
          sha256sum "$APK" | tee /tmp/apk-sha256.txt
          echo "Verified APK: $APK"

      - name: Upload diagnostic APK when native verification fails
        if: failure() && env.APK != ''
        uses: actions/upload-artifact@v4
        with:
          name: rockbox-rcc-diagnostic-unverified
          path: |
            ${{ env.APK }}
            build-android/rockbox.map
          if-no-files-found: warn
          retention-days: 3

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: rockbox-rcc-android13-armeabi
          path: ${{ env.APK }}
          if-no-files-found: error
          retention-days: 14
